services:
  - type: web
    name: application-form-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DOWNLOAD_KEY
        value: jbpf2026secure
      - key: FRONTEND_URL
        value: https://your-app.vercel.app
